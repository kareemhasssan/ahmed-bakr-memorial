
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>على روح المرحوم أحمد بكر ياسين</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="bg" id="bg"></div>
  <div class="overlay"></div>

  <main class="stage">

    <figure class="art-card">
      <img
        id="cover"
        src="img/aa.jpg"
        alt="صورة المرحوم أحمد بكر ياسين"
      >
    </figure>

    <section class="dedication">
      <span class="ornament"></span>

      <p class="dedication-line">على روح المرحوم</p>
      <h1 class="dedication-name">أحمد بكر ياسين</h1>

      <p class="prayer">
        اللهم اغفر له وارحمه، وأسكنه فسيح جناتك.
      </p>

      <span class="ornament"></span>
    </section>

    <section class="player" aria-label="مشغل القرآن الكريم">

      <div class="player-heading">
        <div class="quran-icon">۞</div>

        <div class="track-info">
          <h2>سورة يس</h2>
          <p>بصوت عبدالرحمن مسعد</p>
        </div>
      </div>

      <audio
        id="audio"
        preload="metadata"
        src="audio/036.mp3"
      ></audio>

      <div class="controls">

        <button
          class="play-btn"
          id="playBtn"
          type="button"
          aria-label="تشغيل"
        >
          <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5.5v13l11-6.5-11-6.5z"/>
          </svg>
        </button>

        <div class="progress-area">

          <div class="progress-bar" id="progressBar">
            <div class="bar-fill" id="barFill"></div>
            <input
              id="seek"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="تقدم التلاوة"
            >
          </div>

          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>

        </div>
      </div>

      <p id="status" class="status" aria-live="polite">
        استمع إلى سورة يس
      </p>

    </section>

    <footer>صدقة ودعاء بالرحمة والمغفرة</footer>

  </main>

  <script src="js/player.js"></script>

</body>
</html>
